name: Compatibility result
description: Submit a successful or failed physical-device test result
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Mac Smooth Scroll on real hardware. One report should describe one Mac, macOS version, mouse or native input, and app commit.

        Do not include usernames, computer names, serial numbers, hardware UUIDs, device identifiers, certificates, Accessibility database exports, or raw wheel activity.

  - type: input
    id: app
    attributes:
      label: App version, build, and commit
      placeholder: "0.6.0 (10), abc1234"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and build
      placeholder: "macOS 15.6 (24G84)"
    validations:
      required: true

  - type: dropdown
    id: silicon
    attributes:
      label: Apple Silicon generation
      options:
        - M1
        - M2
        - M3
        - M4
        - M5 or later
    validations:
      required: true

  - type: input
    id: mouse
    attributes:
      label: Mouse or native input
      description: Include the model name, but not a serial number or device identifier.
      placeholder: "Logitech MX Master 3S"
    validations:
      required: true

  - type: dropdown
    id: wheel
    attributes:
      label: Input type
      options:
        - Notched external wheel
        - Free-spinning external wheel
        - Horizontal-capable external wheel
        - Trackpad
        - Magic Mouse
        - Other
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display refresh rate
      placeholder: "60 Hz or 120 Hz"
    validations:
      required: true

  - type: input
    id: utilities
    attributes:
      label: Other mouse utilities
      placeholder: "None, Logitech Options+ 1.90, LinearMouse 0.10"
    validations:
      required: true

  - type: dropdown
    id: calibration
    attributes:
      label: Calibration result
      options:
        - Not run
        - Notched wheel
        - High-resolution or free-spinning wheel
        - Mixed wheel input
        - Native continuous input
        - More input needed
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Manual checklist results
      description: Mark each section Pass, Fail, Blocked, or Not run. Include individual case IDs when possible.
      placeholder: |
        A. Installation and launch: Pass
        B. Accessibility: Pass
        C. Scrolling and native input: Pass (C1-C14)
        D. Modifier keys: Not run
        E-J: Not run
    validations:
      required: true

  - type: textarea
    id: observations
    attributes:
      label: Observations or failures
      description: Describe perceived behavior and reproducible failures. Do not paste raw event logs.
      placeholder: "C1 passed. C11 failed twice: reversing left a one-second tail in the old direction."

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence check
      options:
        - label: I tested this result on physical hardware rather than inferring it from a build or unit test.
          required: true
        - label: I removed personal data, device identifiers, certificates, Accessibility database exports, and raw wheel activity.
          required: true
