name: Apple Silicon CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-silicon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon-build:
    name: Apple Silicon arm64 build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Confirm Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Validate source files
        run: |
          set -euo pipefail
          zsh -n Scripts/build-app.sh Scripts/build-dmg.sh Scripts/validate-release.sh
          swiftc -parse Scripts/render-dmg-background.swift
          plutil -lint Resources/Info.plist Resources/Launcher-Info.plist
          git diff --check

      - name: Run unit tests
        run: swift test --arch arm64

      - name: Build app and DMG installer
        run: ./Scripts/build-dmg.sh

      - name: Validate preview release bundle
        run: ./Scripts/validate-release.sh --allow-adhoc

      - name: Upload preview release bundle
        uses: actions/upload-artifact@v7
        with:
          name: mac-smooth-scroll-${{ github.sha }}-arm64-preview
          path: |
            dist/Mac-Smooth-Scroll-*-arm64.dmg
            dist/Mac-Smooth-Scroll-*-arm64.dmg.sha256
            dist/Mac-Smooth-Scroll-*-arm64-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm build leaves source clean
        run: test -z "$(git status --short)"
